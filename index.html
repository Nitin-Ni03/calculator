<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NovaCalc - A sleek, ultra-modern glassmorphic scientific and standard calculator with dynamic themes, audio feedback, calculation history, and keyboard support.">
  <meta name="keywords" content="calculator, scientific calculator, online calculator, glassmorphic UI, modern calculator web app">
  <meta name="author" content="NovaCalc">
  <meta property="og:title" content="NovaCalc - Modern Glassmorphic Calculator">
  <meta property="og:description" content="Next-generation web calculator with standard & scientific modes, calculation history, tactile audio feedback, and modern aesthetics.">
  <meta property="og:type" content="website">
  <title>NovaCalc — Modern Glassmorphic Scientific & Standard Calculator</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="cyber-dark">
  <!-- Background Ambient Glow Orbs -->
  <div class="ambient-glow orb-1" aria-hidden="true"></div>
  <div class="ambient-glow orb-2" aria-hidden="true"></div>
  <div class="ambient-glow orb-3" aria-hidden="true"></div>

  <main class="app-container" id="main-container">
    <!-- Header Section -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="2" width="16" height="20" rx="3"></rect>
            <line x1="8" y1="6" x2="16" y2="6"></line>
            <line x1="16" y1="14" x2="16" y2="18"></line>
            <path d="M16 10h.01"></path>
            <path d="M12 10h.01"></path>
            <path d="M8 10h.01"></path>
            <path d="M12 14h.01"></path>
            <path d="M8 14h.01"></path>
            <path d="M12 18h.01"></path>
            <path d="M8 18h.01"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1>NovaCalc</h1>
          <span class="badge" id="angle-mode-indicator">DEG</span>
        </div>
      </div>

      <div class="header-controls">
        <!-- Sound Toggle Button -->
        <button class="icon-btn" id="sound-toggle-btn" title="Toggle Sound Feedback (Mute/Unmute)" aria-label="Toggle Sound">
          <svg class="icon sound-on-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg class="icon sound-off-icon hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>

        <!-- Theme Picker Button -->
        <div class="theme-dropdown-wrapper">
          <button class="icon-btn" id="theme-btn" title="Change Theme" aria-label="Change Color Theme">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
            </svg>
          </button>
          <div class="theme-menu hidden" id="theme-menu">
            <button class="theme-opt active" data-set-theme="cyber-dark">
              <span class="theme-dot cyber-dark-dot"></span> Cyber Obsidian
            </button>
            <button class="theme-opt" data-set-theme="midnight-violet">
              <span class="theme-dot midnight-violet-dot"></span> Midnight Violet
            </button>
            <button class="theme-opt" data-set-theme="aurora-emerald">
              <span class="theme-dot aurora-emerald-dot"></span> Aurora Emerald
            </button>
            <button class="theme-opt" data-set-theme="sunset-blaze">
              <span class="theme-dot sunset-blaze-dot"></span> Sunset Crimson
            </button>
            <button class="theme-opt" data-set-theme="frosted-light">
              <span class="theme-dot frosted-light-dot"></span> Frosted Pearl
            </button>
          </div>
        </div>

        <!-- History Toggle Button -->
        <button class="icon-btn" id="history-toggle-btn" title="View Calculation History" aria-label="View Calculation History">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="12 8 12 12 14 14"></polyline>
            <path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"></path>
          </svg>
          <span class="history-badge hidden" id="history-badge">0</span>
        </button>
      </div>
    </header>

    <!-- Mode Selector Tabs -->
    <nav class="mode-nav" aria-label="Calculator Modes">
      <div class="mode-pill-container">
        <button class="mode-tab active" id="tab-standard" data-mode="standard">Standard</button>
        <button class="mode-tab" id="tab-scientific" data-mode="scientific">Scientific</button>
        <div class="mode-slider" id="mode-slider"></div>
      </div>
    </nav>

    <!-- Calculator Card -->
    <div class="calculator-card" id="calculator-card">
      <!-- Display Area -->
      <section class="display-panel" id="display-panel" aria-label="Display">
        <div class="display-top-bar">
          <div class="memory-indicator" id="memory-indicator" title="Memory In Use">M</div>
          <div class="calc-expression" id="calc-expression" title="Previous calculation"></div>
        </div>
        <div class="display-main-bar">
          <div class="calc-result" id="calc-result" aria-live="polite">0</div>
          <button class="copy-btn" id="copy-btn" title="Copy result to clipboard" aria-label="Copy result">
            <svg class="copy-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span class="copy-tooltip" id="copy-tooltip">Copied!</span>
          </button>
        </div>
      </section>

      <!-- Memory Toolbar -->
      <div class="memory-toolbar" id="memory-toolbar" role="toolbar" aria-label="Memory Controls">
        <button class="mem-btn" data-mem="MC" title="Memory Clear">MC</button>
        <button class="mem-btn" data-mem="MR" title="Memory Recall">MR</button>
        <button class="mem-btn" data-mem="M+" title="Memory Add">M+</button>
        <button class="mem-btn" data-mem="M-" title="Memory Subtract">M-</button>
        <button class="mem-btn" data-mem="MS" title="Memory Store">MS</button>
      </div>

      <!-- Keypad Grid Wrapper -->
      <div class="keypad-layout" id="keypad-layout">
        <!-- Scientific Functions Subgrid (collapsible/expandable) -->
        <div class="scientific-grid hidden" id="scientific-grid">
          <button class="calc-btn fn-btn" data-action="deg-rad" id="btn-deg-rad" title="Toggle Degree/Radian">DEG</button>
          <button class="calc-btn fn-btn" data-action="sin" title="Sine">sin</button>
          <button class="calc-btn fn-btn" data-action="cos" title="Cosine">cos</button>
          <button class="calc-btn fn-btn" data-action="tan" title="Tangent">tan</button>
          
          <button class="calc-btn fn-btn" data-action="asin" title="Inverse Sine">sin⁻¹</button>
          <button class="calc-btn fn-btn" data-action="acos" title="Inverse Cosine">cos⁻¹</button>
          <button class="calc-btn fn-btn" data-action="atan" title="Inverse Tangent">tan⁻¹</button>
          <button class="calc-btn fn-btn" data-action="pi" title="Pi (3.14159...)">π</button>

          <button class="calc-btn fn-btn" data-action="ln" title="Natural Logarithm (ln)">ln</button>
          <button class="calc-btn fn-btn" data-action="log" title="Logarithm base 10 (log)">log</button>
          <button class="calc-btn fn-btn" data-action="e" title="Euler's Number (2.71828...)">e</button>
          <button class="calc-btn fn-btn" data-action="factorial" title="Factorial (n!)">n!</button>

          <button class="calc-btn fn-btn" data-action="pow" title="Power (x^y)">xʸ</button>
          <button class="calc-btn fn-btn" data-action="square" title="Square (x²)">x²</button>
          <button class="calc-btn fn-btn" data-action="cube" title="Cube (x³)">x³</button>
          <button class="calc-btn fn-btn" data-action="sqrt" title="Square Root (√x)">√x</button>

          <button class="calc-btn fn-btn" data-action="cbrt" title="Cube Root (∛x)">∛x</button>
          <button class="calc-btn fn-btn" data-action="inv" title="Reciprocal (1/x)">1/x</button>
          <button class="calc-btn fn-btn" data-action="abs" title="Absolute Value (|x|)">|x|</button>
          <button class="calc-btn fn-btn" data-action="exp" title="Exponential (eˣ)">eˣ</button>
        </div>

        <!-- Primary Standard Keypad Grid -->
        <div class="standard-grid" id="standard-grid">
          <!-- Row 1 -->
          <button class="calc-btn clear-btn" data-action="clear-all" id="btn-clear-all" title="Clear All (Esc)">AC</button>
          <button class="calc-btn clear-btn" data-action="clear-entry" id="btn-clear-entry" title="Clear Entry (Del)">C</button>
          <button class="calc-btn action-btn" data-action="backspace" id="btn-backspace" title="Backspace (⌫)">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
              <line x1="18" y1="9" x2="12" y2="15"></line>
              <line x1="12" y1="9" x2="18" y2="15"></line>
            </svg>
          </button>
          <button class="calc-btn op-btn" data-op="/" id="btn-divide" title="Divide (/)">÷</button>

          <!-- Row 2 -->
          <button class="calc-btn op-btn" data-action="bracket-open" id="btn-open-bracket" title="Open Parenthesis">(</button>
          <button class="calc-btn op-btn" data-action="bracket-close" id="btn-close-bracket" title="Close Parenthesis">)</button>
          <button class="calc-btn op-btn" data-action="percent" id="btn-percent" title="Percentage (%)">%</button>
          <button class="calc-btn op-btn" data-op="*" id="btn-multiply" title="Multiply (*)">×</button>

          <!-- Row 3 -->
          <button class="calc-btn num-btn" data-num="7" id="btn-7">7</button>
          <button class="calc-btn num-btn" data-num="8" id="btn-8">8</button>
          <button class="calc-btn num-btn" data-num="9" id="btn-9">9</button>
          <button class="calc-btn op-btn" data-op="-" id="btn-subtract" title="Subtract (-)">−</button>

          <!-- Row 4 -->
          <button class="calc-btn num-btn" data-num="4" id="btn-4">4</button>
          <button class="calc-btn num-btn" data-num="5" id="btn-5">5</button>
          <button class="calc-btn num-btn" data-num="6" id="btn-6">6</button>
          <button class="calc-btn op-btn" data-op="+" id="btn-add" title="Add (+)">+</button>

          <!-- Row 5 -->
          <button class="calc-btn num-btn" data-num="1" id="btn-1">1</button>
          <button class="calc-btn num-btn" data-num="2" id="btn-2">2</button>
          <button class="calc-btn num-btn" data-num="3" id="btn-3">3</button>
          <button class="calc-btn equals-btn" data-action="calculate" id="btn-equals" title="Calculate (Enter)">=</button>

          <!-- Row 6 -->
          <button class="calc-btn action-btn" data-action="negate" id="btn-negate" title="Toggle Sign (±)">±</button>
          <button class="calc-btn num-btn" data-num="0" id="btn-0">0</button>
          <button class="calc-btn num-btn" data-action="decimal" id="btn-decimal" title="Decimal Point (.)">.</button>
        </div>
      </div>
    </div>

    <!-- Quick Keyboard Shortcut Hint Tooltip Bar -->
    <footer class="app-footer">
      <div class="keyboard-hints">
        <span class="hint-item"><kbd>Enter</kbd> =</span>
        <span class="hint-item"><kbd>Esc</kbd> AC</span>
        <span class="hint-item"><kbd>⌫</kbd> Del</span>
        <span class="hint-item"><kbd>+</kbd> <kbd>−</kbd> <kbd>×</kbd> <kbd>÷</kbd> Operators</span>
      </div>
      <div class="creator-tag">Crafted with precision &bull; NovaCalc v2.0</div>
    </footer>
  </main>

  <!-- Slide-in History Drawer -->
  <aside class="history-drawer" id="history-drawer" aria-label="Calculation History" aria-hidden="true">
    <div class="drawer-header">
      <div class="drawer-title">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <h3>Calculation History</h3>
      </div>
      <button class="icon-btn close-drawer-btn" id="close-history-btn" title="Close History" aria-label="Close History">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="drawer-body" id="history-list">
      <div class="empty-history" id="empty-history">
        <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"></path>
        </svg>
        <p>No calculation history yet</p>
        <span>Your calculations will automatically appear here</span>
      </div>
    </div>

    <div class="drawer-footer">
      <button class="clear-history-btn" id="clear-history-btn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        Clear All History
      </button>
    </div>
  </aside>

  <div class="drawer-overlay" id="drawer-overlay"></div>

  <!-- Audio Synthesizer & Logic Scripts -->
  <script src="script.js"></script>
</body>
</html>
